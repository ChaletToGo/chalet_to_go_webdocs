<section id="garantias" class="section warranty"><p class="eyebrow">{{ text.warranty }}</p><h2>{{ text.warranty_title }}</h2><div class="warranty-grid"><article><h3>{{ text.swiss_title }}</h3><strong>{{ text.swiss_term }}</strong><p>{{ text.swiss_body }}</p></article><article><h3>{{ text.brazil_title }}</h3><strong>{{ text.brazil_term }}</strong><p>{{ text.brazil_body }}</p></article></div><p class="warranty-note">{{ text.warranty_note }}</p><a class="text-link sales-action" href="{{ product.whatsapp if product else whatsapp }}" target="_blank" rel="noopener noreferrer">{{ text.whatsapp }} <span aria-hidden="true">↗</span></a></section>
