<section id="galeria" class="interior-section" data-reveal>
  <div class="gallery-masthead"><p class="eyebrow">04 / {{ text.gallery_label }}</p><span>CHALET TO GO — 06</span></div>
  <div class="section-heading"><h2>{{ text.gallery_title }}</h2><p class="section-intro">{{ text.gallery_body }}</p></div>
  <div class="masonry-gallery">
  {% for slug,kind,w,h in gallery %}
    {% set caption = text.gallery_captions[loop.index0] %}
    <figure class="gallery-card">
      <a href="{{ url_for('site_static',path='images/' ~ slug ~ '-1440.webp')|local_url }}" class="gallery-open" aria-label="{{ text.expand_image }} — {{ caption }}"><img src="{{ url_for('site_static',path='images/' ~ slug ~ '-960.webp')|local_url }}" alt="{{ caption }}" width="{{ w }}" height="{{ h }}" loading="lazy" decoding="async">{% if kind == 'plan' %}<img class="gallery-seal" src="{{ url_for('static',path='images/suisse_garantie.png')|local_url }}" alt="Suisse Garantie" width="68" height="68" loading="lazy">{% endif %}<span class="gallery-expand" aria-hidden="true">↗</span></a>
      <figcaption><span class="gallery-index">0{{ loop.index }}</span><span>{{ caption }}</span></figcaption>
    </figure>
  {% endfor %}
  </div><p class="image-note">{{ text.image_note }}</p>
  <dialog class="gallery-dialog" aria-label="{{ text.gallery_label }}"><button type="button" class="gallery-close" aria-label="{{ text.close_image }}">×</button><img alt=""><p></p></dialog>
</section>
