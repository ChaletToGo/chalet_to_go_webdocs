name: Deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chalet-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: production
      url: https://www.chalettogo.com
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
      DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/home/rafael/chalet_to_go_webdocs' }}
      DEPLOY_SHA: ${{ github.sha }}
    steps:
      - name: Validate deployment settings
        shell: bash
        run: |
          set -euo pipefail
          for setting in DEPLOY_HOST DEPLOY_USER DEPLOY_SSH_KEY DEPLOY_KNOWN_HOSTS; do
            if [[ -z "${!setting}" ]]; then
              echo "::error::Configure the secret $setting in the production environment."
              exit 1
            fi
          done
          [[ "$DEPLOY_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ ]]
          [[ "$DEPLOY_USER" =~ ^[a-zA-Z_][a-zA-Z0-9_-]*$ ]]
          [[ "$DEPLOY_PORT" =~ ^[0-9]{1,5}$ ]]
          (( 10#$DEPLOY_PORT >= 1 && 10#$DEPLOY_PORT <= 65535 ))
          [[ "$DEPLOY_PATH" =~ ^/[a-zA-Z0-9_./-]+$ ]]
          [[ "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]]

      - name: Update application on VPS
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          ssh_dir=$(mktemp -d)
          trap 'rm -rf -- "$ssh_dir"' EXIT
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$ssh_dir/key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          ssh -T -i "$ssh_dir/key" -p "$DEPLOY_PORT" \
            -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$ssh_dir/known_hosts" \
            -o ConnectTimeout=15 -o ServerAliveInterval=30 -o ServerAliveCountMax=6 \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "bash -s -- '$DEPLOY_PATH' '$DEPLOY_SHA'" <<'REMOTE'
          set -euo pipefail
          export GIT_TERMINAL_PROMPT=0
          export GIT_SSH_COMMAND='ssh -o BatchMode=yes -o StrictHostKeyChecking=yes'
          cd -- "$1"
          expected_sha=$2
          test -d .git
          test -f .env || { echo 'Missing .env on the server.'; exit 1; }
          exec 9>.git/deploy.lock
          flock -w 600 9
          [[ "$(git branch --show-current)" == main ]] || {
            echo 'The server checkout must be on main.'; exit 1;
          }
          if [[ -n "$(git status --porcelain)" ]]; then
            echo 'The server has local changes. Commit or preserve them before deploying.'
            exit 1
          fi
          docker_cmd=(docker)
          if ! docker info >/dev/null 2>&1; then
            docker_cmd=(sudo -n docker)
            "${docker_cmd[@]}" info >/dev/null
          fi
          "${docker_cmd[@]}" compose version
          git fetch --no-tags origin main
          if [[ "$(git rev-parse FETCH_HEAD)" != "$expected_sha" ]]; then
            echo 'A newer main commit exists. Skipping this outdated deployment.'
            exit 0
          fi
          git merge-base --is-ancestor HEAD "$expected_sha" || {
            echo 'Server history diverged from main. Deployment stopped.'; exit 1;
          }
          git merge --ff-only "$expected_sha"
          "${docker_cmd[@]}" compose config --quiet
          # Build first: a failed build leaves the current container running.
          "${docker_cmd[@]}" compose build web
          if ! "${docker_cmd[@]}" compose up -d --no-build --wait --wait-timeout 120 web; then
            "${docker_cmd[@]}" compose ps
            echo 'Deployment did not become healthy. Inspect docker compose logs --tail 100 web on the VPS.'
            exit 1
          fi
          "${docker_cmd[@]}" compose exec -T web python -c \
            'import json; from urllib.request import urlopen; response=urlopen("http://127.0.0.1:8000/healthz", timeout=10); assert response.status == 200; assert json.load(response)["status"] == "ok"'
          echo "Deployment healthy: $expected_sha"
          REMOTE
