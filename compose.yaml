name: chalet-to-go

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: chalet-to-go-webdocs:local
    restart: unless-stopped
    init: true
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-8000}:8000"
    networks:
      proxy:
        aliases:
          - chalet-web
    environment:
      TRUST_COUNTRY_HEADER: "${TRUST_COUNTRY_HEADER:-false}"
      FORWARDED_ALLOW_IPS: "${FORWARDED_ALLOW_IPS:-127.0.0.1}"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  proxy:
    name: ${PROXY_NETWORK:-nginxproxymanager_default}
    external: true
